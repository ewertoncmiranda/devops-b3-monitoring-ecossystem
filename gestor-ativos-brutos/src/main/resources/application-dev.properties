spring.application.name=gestor-ativos-brutos
server.port=${SERVER_PORT:9090}

aws.sqs.endpoint.base=${AWS_SQS_ENDPOINT_BASE:http://localstack:4566}
aws.sqs.queue.url=${AWS_SQS_QUEUE_URL:http://localstack:4566/000000000000/tratar-ativos}
aws.accessKeyId=teste
aws.secretAccessKey=teste

brapi.api.key=${BRAPI_API_KEY:kJfyqy8yUVj94SivLsKq4Q}
ollama.endpoint=${OLLAMA_ENDPOINT:http://localhost:11434}
ollama.model=phi3:mini
ollama.system-prompt=Voce e um assistente financeiro especializado no mercado de acoes brasileiro (B3). Responda de forma objetiva e tecnica, sempre em portugues.
ollama.max-tokens=2048
ollama.temperature=0.5
ollama.context-length=8192

# Disable DataSource auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# =====================
# ACTUATOR - Health, Metrics & Endpoints
# =====================
# Expor todos os endpoints do Actuator via HTTP
management.endpoints.web.exposure.include=health,info,metrics,mappings,env,beans

# Health check detalhado (mostra status de cada componente)
management.endpoint.health.show-details=always

# Informações da aplicação
management.info.env.enabled=true
info.app.name=gestor-ativos-brutos
info.app.description=Gestor de ativos brutos - Ecossistema B3 Monitoring
info.app.version=0.0.1-SNAPSHOT

# Métricas customizadas habilitadas
management.metrics.tags.application=${spring.application.name}
